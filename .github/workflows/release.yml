name: Publish Linux and Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Ubuntu 24.04 x86_64
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build dpkg-dev \
            qt6-base-dev qt6-multimedia-dev qt6-qpa-plugins qt6-wayland
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr -DBADOING_ENABLE_SOUND=ON
          -DBADOING_DEPLOY_QT=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package with runtime dependencies
        run: |
          cpack --config build/CPackConfig.cmake -G DEB \
            -D CPACK_PACKAGE_FILE_NAME=badoing-linux-ubuntu24.04-amd64 \
            -D CPACK_PACKAGING_INSTALL_PREFIX=/usr \
            -D CPACK_DEBIAN_PACKAGE_MAINTAINER="BADOING contributors" \
            -D CPACK_DEBIAN_PACKAGE_RELEASE="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D "CPACK_DEBIAN_PACKAGE_DEPENDS=qt6-qpa-plugins, qt6-wayland"
      - name: Install and verify the release package
        run: |
          sudo apt-get install -y "$PWD/build/packages/badoing-linux-ubuntu24.04-amd64.deb"
          python3 scripts/verify-install.py /usr
          python3 tests/test_helper.py /usr
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build/packages/badoing-linux-ubuntu24.04-amd64.deb
          if-no-files-found: error

  windows:
    name: Windows / x64
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBADOING_ENABLE_SOUND=ON -DBADOING_DEPLOY_QT=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package with Qt and compiler runtimes
        run: >-
          cpack --config build/CPackConfig.cmake -G ZIP
          -D CPACK_PACKAGE_FILE_NAME=badoing-windows-x64
          -D CPACK_INCLUDE_TOPLEVEL_DIRECTORY=OFF
      - name: Extract and verify the release package
        run: |
          Expand-Archive -LiteralPath build/packages/badoing-windows-x64.zip -DestinationPath "package check"
          foreach ($runtime in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "Qt6Multimedia.dll")) {
            if (!(Test-Path -LiteralPath "package check/bin/$runtime")) {
              throw "Missing bundled runtime: $runtime"
            }
          }
          python scripts/verify-install.py "package check" --bundled-qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_helper.py "package check"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/packages/badoing-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: downloads
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd downloads
          test -s badoing-linux-ubuntu24.04-amd64.deb
          test -s badoing-windows-x64.zip
          sha256sum badoing-linux-ubuntu24.04-amd64.deb badoing-windows-x64.zip > SHA256SUMS

          current_master=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)
          if [[ "$current_master" != "$GITHUB_SHA" ]]; then
            printf 'master has moved; skipping this older build.\n'
            exit 0
          fi

          printf 'Built and tested from master commit [%s](%s/%s/commit/%s).\n\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > release-notes.md
          cat >> release-notes.md <<'EOF'
          - **Linux x86_64, Ubuntu 24.04:** Download `badoing-linux-ubuntu24.04-amd64.deb` and run `sudo apt install ./badoing-linux-ubuntu24.04-amd64.deb`. Start `badoing-pet` from your terminal or application menu. Apt installs the Qt runtime dependencies. Other distributions can build from source using INSTALL.md.
          - **Windows x64:** Download and extract `badoing-windows-x64.zip`, then open `bin/badoing-pet.exe`. Keep the extracted files together. Qt and compiler runtimes are included; no Qt SDK is needed.
          - **Updating:** Quit the pet before installing a newer package or replacing the extracted Windows directory. Settings are preserved. Re-enable Start at login if you move the Windows directory.

          Download the platform package under **Assets**, rather than GitHub's automatic source archives. SHA256SUMS contains download checksums. These packages are unsigned. See the included INSTALL.md for details.

          EOF
          printf '[Build and test log](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md

          gh release create "master-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            badoing-linux-ubuntu24.04-amd64.deb badoing-windows-x64.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "BADOING build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md --latest
